name: trackly_inspector
description: An in-app network, log, and performance inspector for Flutter. See every Dio and http call with headers and bodies, copy it as cURL, and find slow screens.
version: 0.5.1
repository: https://github.com/IslamAbdElhady/trackly_inspector
issue_tracker: https://github.com/IslamAbdElhady/trackly_inspector/issues

topics:
  - network
  - http
  - dio
  - debugging
  - inspector

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  dio: ^5.4.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  sensors_plus: ">=6.0.0 <8.0.0"
  trackly_logger: ^0.2.0

dev_dependencies:
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter

screenshots:
  - description: Touch a price to find the request it came from, with the field highlighted.
    path: screenshots/demo.gif
  - description: Every request with its method, status, duration, and size.
    path: screenshots/network.png
  - description: Touch anything on screen to find the request its data came from.
    path: screenshots/inspect.png
  - description: The matching field, highlighted in the response.
    path: screenshots/source.png
  - description: Request details with a ready-to-copy cURL command.
    path: screenshots/details.png
  - description: Logs from trackly_logger, with errors and stack traces.
    path: screenshots/logs.png
  - description: Each screen's load time, requests, and slow frames.
    path: screenshots/performance.png
  - description: A screen's requests as a waterfall, and its frames.
    path: screenshots/screen.png
